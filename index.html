<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>L2D Viewer</title>
  <link rel="icon" href="data:,">
  <script>
    try {
      if (localStorage.getItem("l2d-viewer-theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js" integrity="sha384-98eYPI3XO3wKMBW5IUYk3WpffOsMLc+0WSK+ZMutD8S5R6e4E7hKIqFKcdHBLOMB" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/gh/dylanNew/live2d@fd9fd400845e9a00bb194fdac0b6635c753a1e8a/webgl/Live2D/lib/live2d.min.js" integrity="sha384-LWrKEMeBVbWko3WFDXTIBDN5SpFKepeYUI2JE6It+qbq+F+2NvN2QDO2J8H+8Y+O" crossorigin="anonymous"></script>
  <script defer src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js" integrity="sha384-Ukg4e48mEdLvXx4ipNmtVmWcMoKjgs89aotHN/5CB3Bj77JPioyjXXYORMiunxFz" crossorigin="anonymous"></script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main id="stage" class="stage" aria-label="模型画布" data-i18n-aria-label="canvas">
    <div id="stage-empty" class="stage-empty">
      <div class="empty-art" aria-hidden="true"><span></span></div>
      <h1 data-i18n="importModels">导入 Live2D 模型</h1>
      <p data-i18n="importHint">拖入模型文件夹，或点击 + 选择文件夹。</p>
    </div>
  </main>
  <div id="folder-drop" class="folder-drop" aria-hidden="true" hidden>
    <p class="glass" data-i18n="dropFolders">松开以导入文件夹</p>
  </div>

  <header id="toolbar-dock" class="toolbar-dock" data-expanded="true">
    <div id="toolbar" class="toolbar glass">
      <nav class="tool-row" aria-label="功能栏" data-i18n-aria-label="toolbar">
        <button id="add-models" type="button" class="primary add-models" aria-label="导入文件夹" data-i18n-aria-label="importFolder" title="导入文件夹" data-i18n-title="importFolder">+</button>
        <select id="resource-models" class="resource-models" aria-label="仓库模型" data-i18n-aria-label="resourceModels" autocomplete="off" disabled>
          <option value="" data-i18n="resourceModels">仓库模型</option>
        </select>
        <form id="model-url-form" class="model-url-form">
          <input id="model-url" type="url" aria-label="模型 JSON 链接" data-i18n-aria-label="modelURL" title="输入模型描述文件的直链。跨站链接需要支持 CORS。" data-i18n-title="modelURLHint" placeholder="https://…/model.model3.json" autocomplete="off" spellcheck="false" required disabled>
          <button id="import-url" type="submit" data-i18n="importURL" disabled>链接导入</button>
        </form>
        <div class="model-actions">
          <button id="toggle-playback" type="button" disabled data-i18n="pause" hidden>暂停</button>
          <button id="copy-model" type="button" aria-label="复制选中的模型" data-i18n-aria-label="copyModel" disabled data-i18n="copy">复制</button>
          <button id="remove-model" type="button" aria-label="移除选中的模型" data-i18n-aria-label="removeModel" disabled data-i18n="remove">移除</button>
        </div>
        <div class="tool-spacer"></div>
        <div class="view-actions">
          <button id="toggle-basic" type="button" aria-expanded="false" aria-controls="basic-window" disabled data-i18n="basic">基础</button>
          <button id="toggle-animation" type="button" aria-expanded="false" aria-controls="animation-window" disabled data-i18n="animationPanel">动作和表情</button>
          <button id="toggle-inspector" type="button" aria-expanded="false" aria-controls="inspector" disabled data-i18n="inspector">参数</button>
          <button id="toggle-transform" type="button" aria-expanded="false" aria-controls="transform-window" disabled data-i18n="transform">变换</button>
          <button id="background-tools" type="button" popovertarget="background-popover" data-i18n="background" aria-label="画布背景" data-i18n-aria-label="canvasBackground">背景</button>
          <button id="export-image" type="button" popovertarget="export-image-popover" disabled data-i18n="exportImage">导出图片</button>
          <button id="theme-toggle" type="button" class="theme-switch" role="switch" aria-label="深色模式" data-i18n-aria-label="darkMode" aria-checked="false">
            <svg aria-hidden="true"><use href="./assets/icons.svg#sun"></use></svg>
            <svg aria-hidden="true"><use href="./assets/icons.svg#moon"></use></svg>
          </button>
          <select id="language-select" class="language-select" aria-label="界面语言" data-i18n-aria-label="language" title="界面语言" data-i18n-title="language">
            <option value="zh" lang="zh-CN">中文</option>
            <option value="en" lang="en">English</option>
          </select>
          <div class="tool-separator" aria-hidden="true"></div>
          <button id="pin-toolbar" type="button" aria-label="固定功能栏" data-i18n-aria-label="pinToolbar" aria-pressed="true" title="取消固定后，移出功能栏会自动收起" data-i18n-title="unpinHint" data-i18n="pin">固定</button>
        </div>
      </nav>
      <div class="model-summary">
        <span id="model-count" class="model-count">0 个模型</span>
        <div class="tool-separator" aria-hidden="true"></div>
        <div id="model-strip" class="model-strip" role="group" aria-label="模型图层，右侧在上层" data-i18n-aria-label="layers"></div>
        <span id="playback-state" class="playback-state" hidden></span>
      </div>
    </div>
    <button id="reveal-toolbar" type="button" class="toolbar-reveal" aria-controls="toolbar" aria-label="展开功能栏" data-i18n-aria-label="showToolbar" hidden></button>
  </header>

  <input id="folder-input" type="file" webkitdirectory multiple hidden>
  <input id="background-input" type="file" accept="image/*" hidden>

  <template id="motion-loop-template">
    <label class="animation-loop">
      <input type="checkbox" class="toggle-switch" role="switch" data-motion-loop aria-label="动作循环" data-i18n-aria-label="motionLoop" autocomplete="off">
      <span data-motion-loop-status></span>
    </label>
  </template>

  <section id="background-popover" class="tool-popover glass" popover="auto" aria-labelledby="background-heading">
    <h2 id="background-heading" data-i18n="canvasBackground">画布背景</h2>
    <div class="background-swatches" aria-label="预设颜色" data-i18n-aria-label="backgroundPresets">
      <button type="button" data-background="" aria-pressed="true"><span class="swatch theme-swatch"></span><span data-i18n="defaultColor">默认</span></button>
      <button type="button" data-background="#ffffff" aria-pressed="false"><span class="swatch" style="--swatch: #fff"></span><span data-i18n="white">白色</span></button>
      <button type="button" data-background="#d9e6f7" aria-pressed="false"><span class="swatch" style="--swatch: #d9e6f7"></span><span data-i18n="mistBlue">雾蓝</span></button>
      <button type="button" data-background="#f6e4eb" aria-pressed="false"><span class="swatch" style="--swatch: #f6e4eb"></span><span data-i18n="lightPink">浅粉</span></button>
      <button type="button" data-background="#ffe5cc" aria-pressed="false"><span class="swatch" style="--swatch: #ffe5cc"></span><span data-i18n="lightOrange">浅橙色</span></button>
      <button type="button" data-background="#262b39" aria-pressed="false"><span class="swatch" style="--swatch: #262b39"></span><span data-i18n="charcoal">炭黑</span></button>
      <button type="button" data-background="#00b140" aria-pressed="false"><span class="swatch" style="--swatch: #00b140"></span><span data-i18n="greenScreen">绿幕</span></button>
    </div>
    <label class="background-dots">
      <span data-i18n="backgroundDots">显示圆点</span>
      <input id="background-dots" class="toggle-switch" type="checkbox" role="switch" autocomplete="off" checked>
    </label>
    <button id="upload-background" type="button" class="background-upload" data-i18n="uploadImage">上传图片</button>
    <p id="background-status" class="inline-message muted" role="status" hidden></p>
  </section>

  <section id="export-image-popover" class="tool-popover glass" popover="auto" aria-labelledby="export-image-heading">
    <h2 id="export-image-heading" data-i18n="exportImage">导出图片</h2>
    <div class="image-export-actions">
      <button type="button" data-export-background="visible" data-i18n="exportVisibleBackground">当前背景</button>
      <button type="button" data-export-background="transparent" data-i18n="exportTransparent">透明背景</button>
    </div>
    <p class="inline-message error" role="status" data-i18n="imageExportFailed" hidden>无法导出图片，请重试。</p>
  </section>

  <aside id="basic-window" class="basic-window floating-panel glass" aria-labelledby="basic-heading" hidden>
    <div class="inspector-bar">
      <h2 id="basic-heading" data-i18n="basic">基础</h2>
      <button id="close-basic" type="button" class="quiet close" aria-label="关闭基础面板" data-i18n-aria-label="closeBasic">×</button>
    </div>
    <div class="basic-content">
      <div class="basic-effect">
        <label class="basic-toggle">
          <span data-i18n="gazeFollow">视线跟随</span>
          <input type="checkbox" class="toggle-switch" role="switch" data-effect="gazeFollow" autocomplete="off">
        </label>
      </div>
      <div class="basic-effect">
        <label class="basic-toggle">
          <span data-i18n="headSway">头部晃动</span>
          <input type="checkbox" class="toggle-switch" role="switch" data-effect="headSway" autocomplete="off">
        </label>
      </div>
      <div class="basic-effect">
        <label class="basic-toggle">
          <span data-i18n="physics">物理摆动</span>
          <input type="checkbox" class="toggle-switch" role="switch" data-effect="physics" autocomplete="off">
        </label>
        <div class="basic-setting">
          <label for="basic-physics-strength" data-i18n="effectStrength">强度</label>
          <input id="basic-physics-strength" type="range" min="0" max="200" step="5" value="100" data-effect="physicsStrength" data-requires="physics" data-unit="%" aria-label="物理摆动强度" data-i18n-aria-label="physicsStrength">
          <output for="basic-physics-strength">100%</output>
          <button type="button" class="parameter-reset" data-reset-effect="physicsStrength" title="恢复默认值" data-i18n-title="resetDefault" aria-label="重置物理摆动强度" data-i18n-aria-label="resetPhysicsStrength">
            <svg aria-hidden="true"><use href="./assets/icons.svg#reset"></use></svg>
          </button>
        </div>
      </div>
      <div class="basic-effect">
        <label class="basic-toggle">
          <span data-i18n="breathing">自然呼吸</span>
          <input type="checkbox" class="toggle-switch" role="switch" data-effect="breathing" autocomplete="off">
        </label>
        <div class="basic-setting">
          <label for="basic-breath-strength" data-i18n="effectStrength">强度</label>
          <input id="basic-breath-strength" type="range" min="0" max="200" step="5" value="100" data-effect="breathStrength" data-requires="breathing" data-unit="%" aria-label="自然呼吸强度" data-i18n-aria-label="breathStrength">
          <output for="basic-breath-strength">100%</output>
          <button type="button" class="parameter-reset" data-reset-effect="breathStrength" title="恢复默认值" data-i18n-title="resetDefault" aria-label="重置自然呼吸强度" data-i18n-aria-label="resetBreathStrength">
            <svg aria-hidden="true"><use href="./assets/icons.svg#reset"></use></svg>
          </button>
        </div>
      </div>
      <div class="basic-effect">
        <label class="basic-toggle">
          <span data-i18n="eyeBlink">自动眨眼</span>
          <input type="checkbox" class="toggle-switch" role="switch" data-effect="eyeBlink" autocomplete="off">
        </label>
        <div class="basic-setting">
          <label for="basic-blink-interval" data-i18n="effectInterval">间隔</label>
          <input id="basic-blink-interval" type="range" min="1" max="10" step="0.5" value="4" data-effect="blinkInterval" data-requires="eyeBlink" data-unit=" s" aria-label="眨眼间隔（秒）" data-i18n-aria-label="blinkInterval">
          <output for="basic-blink-interval">4 s</output>
          <button type="button" class="parameter-reset" data-reset-effect="blinkInterval" title="恢复默认值" data-i18n-title="resetDefault" aria-label="重置眨眼间隔" data-i18n-aria-label="resetBlinkInterval">
            <svg aria-hidden="true"><use href="./assets/icons.svg#reset"></use></svg>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <aside id="animation-window" class="animation-window floating-panel glass" aria-labelledby="animation-heading" hidden>
    <div class="inspector-bar">
      <h2 id="animation-heading" data-i18n="animationPanel">动作和表情</h2>
      <button id="close-animation" type="button" class="quiet close" aria-label="关闭动作和表情" data-i18n-aria-label="closeAnimation">×</button>
    </div>
    <div class="animation-content">
      <div class="animation-lists">
        <label class="animation-list">
          <span data-i18n="motion">动作</span>
          <select size="12" data-motion-select></select>
        </label>
        <label class="animation-list">
          <span data-i18n="expression">表情</span>
          <select size="12" data-expression-select></select>
        </label>
      </div>
      <div class="animation-playback" data-loop-host>
        <button type="button" data-play-motion data-i18n="replay">（重）播放</button>
      </div>
      <p class="animation-error error" data-animation-error role="status" hidden></p>
    </div>
  </aside>

  <aside id="inspector" class="inspector floating-panel glass" aria-labelledby="inspector-heading" hidden>
    <div id="inspector-bar" class="inspector-bar">
      <h2 id="inspector-heading" data-i18n="inspector">参数</h2>
      <button id="close-inspector" type="button" class="quiet close" aria-label="关闭参数面板" data-i18n-aria-label="closeInspector">×</button>
    </div>
    <div class="inspector-content">
      <div id="inspector-motion-progress" class="motion-progress" data-loop-host>
        <input type="range" min="0" max="0" step="1" value="0" aria-label="动作进度" data-i18n-aria-label="motionProgress" disabled>
        <input type="number" min="0" max="0" step="1" inputmode="numeric" value="0" aria-label="当前动作帧" data-i18n-aria-label="motionFrame" disabled>
        <span data-last-frame class="muted"></span>
      </div>
      <div class="panel-switch" aria-label="参数面板" data-i18n-aria-label="inspectorPanels">
        <button id="show-parameters" type="button" aria-pressed="true" aria-controls="parameters-view" data-i18n="motionParameterTab" aria-label="动作参数" data-i18n-aria-label="motionParameters">动作参数</button>
        <button id="show-expression-parameters" type="button" aria-pressed="false" aria-controls="parameters-view" data-i18n="expressionParameterTab" aria-label="表情参数" data-i18n-aria-label="expressionParameters">表情参数</button>
        <button id="show-json" type="button" aria-pressed="false" aria-controls="json-view" data-i18n="snapshotTab" aria-label="当前参数" data-i18n-aria-label="snapshot">当前参数</button>
        <button id="inspector-playback" type="button" disabled data-i18n="pause">暂停</button>
        <button id="reset-parameters" type="button" data-i18n="resetAll">重置全部参数</button>
      </div>
      <section id="parameters-view" class="parameters-view" aria-label="实时参数" data-i18n-aria-label="liveParameters">
        <div class="parameter-toolbar">
          <input id="parameter-search" type="search" placeholder="搜索参数 ID" data-i18n-placeholder="findParameter" aria-label="搜索参数 ID" data-i18n-aria-label="findParameter">
          <select id="parameter-group" aria-label="参数组" data-i18n-aria-label="parameterGroup">
            <option value="" data-i18n="allParameterGroups">全部参数组</option>
            <option value="other" data-i18n="parameterGroupOther">其他</option>
          </select>
          <span id="parameter-count" class="muted"></span>
        </div>
        <p id="parameter-hint" class="parameter-hint muted"></p>
        <p id="parameter-empty" class="parameter-empty muted" data-i18n="noMatchingParameters" role="status" hidden>没有符合筛选条件的参数。</p>
        <div id="parameter-list" class="parameter-list"></div>
      </section>
      <section id="json-view" class="json-view" aria-label="当前参数" data-i18n-aria-label="snapshot" hidden>
        <label for="parameter-json" data-i18n="parameterJSON">参数 JSON</label>
        <textarea id="parameter-json" placeholder='{"ParamAngleX": 10}' spellcheck="false"></textarea>
        <div class="json-actions">
          <button id="export-json" type="button" data-i18n="exportJSON">导出当前参数</button>
          <div class="json-import-actions">
            <button id="import-json" type="button" class="primary" data-i18n="importJSON">导入参数</button>
            <button id="copy-json" type="button" data-i18n="copyJSON" disabled>复制文本</button>
          </div>
        </div>
        <p id="json-status" class="inline-message muted" role="status" data-i18n="jsonHint">粘贴参数 JSON 后导入，模型会暂停并应用数值。</p>
      </section>
    </div>
  </aside>

  <aside id="transform-window" class="transform-window floating-panel glass" aria-labelledby="transform-heading" hidden>
    <div class="inspector-bar">
      <h2 id="transform-heading" data-i18n="transform">变换</h2>
      <button id="close-transform" type="button" class="quiet close" aria-label="关闭变换面板" data-i18n-aria-label="closeTransform">×</button>
    </div>
    <div class="transform-content">
      <div class="transform-position">
        <div class="direction-pad" role="group" aria-label="移动方向" data-i18n-aria-label="moveDirections">
          <button type="button" class="move-up" aria-label="向上移动" data-i18n-aria-label="moveUp" data-axis="y" data-increment="-20">↑</button>
          <button type="button" class="move-left" aria-label="向左移动" data-i18n-aria-label="moveLeft" data-axis="x" data-increment="-20">←</button>
          <button type="button" class="move-down" aria-label="向下移动" data-i18n-aria-label="moveDown" data-axis="y" data-increment="20">↓</button>
          <button type="button" class="move-right" aria-label="向右移动" data-i18n-aria-label="moveRight" data-axis="x" data-increment="20">→</button>
        </div>
        <div class="position-fields">
          <label class="transform-field">X <input type="number" step="any" data-placement-field="x" aria-label="横向位置" data-i18n-aria-label="positionX"><span>px</span></label>
          <label class="transform-field">Y <input type="number" step="any" data-placement-field="y" aria-label="纵向位置" data-i18n-aria-label="positionY"><span>px</span></label>
        </div>
        <button type="button" data-reset="position" title="重置到展示区左侧" data-i18n-title="resetPositionHint" data-i18n="resetPosition">重置位置</button>
      </div>
      <div class="transform-line">
        <button type="button" aria-label="逆时针旋转" data-i18n-aria-label="rotateLeft" data-axis="angle" data-increment="-5">↶</button>
        <button type="button" aria-label="顺时针旋转" data-i18n-aria-label="rotateRight" data-axis="angle" data-increment="5">↷</button>
        <label class="transform-field"><span data-i18n="angle">角度</span> <input type="number" step="any" data-placement-field="angle" aria-label="旋转角度" data-i18n-aria-label="rotationAngle"><span>°</span></label>
        <button type="button" data-reset="rotation" data-i18n="resetRotation">重置旋转</button>
      </div>
      <div class="transform-line">
        <button type="button" aria-label="缩小模型" data-i18n-aria-label="shrink" data-axis="size" data-increment="-5" data-step-on-click>−</button>
        <button type="button" aria-label="放大模型" data-i18n-aria-label="enlarge" data-axis="size" data-increment="5" data-step-on-click>+</button>
        <label class="transform-field"><span data-i18n="size">大小</span> <input type="number" step="any" data-placement-field="size" aria-label="模型大小百分比" data-i18n-aria-label="sizePercentage"><span>%</span></label>
        <button type="button" data-reset="size" data-i18n="resetSize">重置大小</button>
      </div>
      <label class="canvas-control" title="拖动模型移动，在模型上滚动缩放" data-i18n-title="mouseControlHint">
        <span data-i18n="mouseControls">鼠标操控</span>
        <input id="canvas-mouse" class="toggle-switch" type="checkbox" role="switch" autocomplete="off">
      </label>
    </div>
  </aside>

  <section id="load-report" class="load-report glass" aria-label="模型加载状态" data-i18n-aria-label="loadingStatus" hidden>
    <div class="report-header">
      <p id="load-message" role="status"></p>
      <button id="dismiss-report" type="button" class="quiet close" aria-label="关闭导入提示" data-i18n-aria-label="closeLoadingStatus" hidden>×</button>
    </div>
    <progress id="load-progress" aria-label="模型加载进度" data-i18n-aria-label="loadingProgress" hidden></progress>
    <ul id="load-errors" hidden></ul>
  </section>
</body>
</html>
