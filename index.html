<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>L2D Viewer</title>
  <link rel="icon" href="data:,">
  <script>
    try {
      if (localStorage.getItem("l2d-viewer-theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js" integrity="sha384-98eYPI3XO3wKMBW5IUYk3WpffOsMLc+0WSK+ZMutD8S5R6e4E7hKIqFKcdHBLOMB" crossorigin="anonymous"></script>
  <script defer src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js" integrity="sha384-x73Ez+8Lf2UpkuWDPMvQ/T8scXzifx3geDffp4EdBI2/r/z+NlTxlHA5xySHOP7n" crossorigin="anonymous"></script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main id="stage" class="stage" aria-label="模型画布">
    <div id="stage-empty" class="stage-empty">
      <div class="empty-art" aria-hidden="true"><span></span></div>
      <h1>导入 Live2D 模型</h1>
      <p>选择包含 .model3.json 的文件夹<br>可以一次添加多个模型</p>
    </div>
  </main>

  <header id="toolbar-dock" class="toolbar-dock" data-expanded="true">
    <div id="toolbar" class="toolbar glass">
      <nav class="tool-row" aria-label="功能栏">
        <button id="add-models" type="button" class="primary add-models" aria-label="导入文件夹" title="导入文件夹">+</button>
        <div id="toolbar-animation" class="animation-controls"></div>
        <div class="model-actions">
          <button id="toggle-playback" type="button" disabled>暂停</button>
          <button id="copy-model" type="button" aria-label="复制选中的模型" disabled>复制</button>
          <button id="remove-model" type="button" aria-label="移除选中的模型" disabled>移除</button>
        </div>
        <div class="tool-spacer"></div>
        <div class="view-actions">
          <button id="toggle-inspector" type="button" aria-expanded="false" aria-controls="inspector" disabled>参数<span class="wide-label">检查器</span></button>
          <button id="toggle-transform" type="button" aria-expanded="false" aria-controls="transform-window" disabled>变换</button>
          <button id="background-tools" type="button" popovertarget="background-popover">背景</button>
          <button id="theme-toggle" type="button" aria-label="深色模式" aria-pressed="false">深色</button>
          <div class="tool-separator" aria-hidden="true"></div>
          <button id="pin-toolbar" type="button" aria-label="固定功能栏" aria-pressed="true" title="取消固定后，移出功能栏会自动收起">固定</button>
        </div>
      </nav>
      <div class="model-summary">
        <span id="model-count" class="model-count">0 个模型</span>
        <div class="tool-separator" aria-hidden="true"></div>
        <div id="model-strip" class="model-strip" role="group" aria-label="模型图层，右侧在上层"></div>
        <span id="playback-state" class="playback-state" hidden></span>
      </div>
    </div>
    <button id="reveal-toolbar" type="button" class="toolbar-tab glass" aria-controls="toolbar" hidden>
      <span class="tab-mark" aria-hidden="true"></span> 功能栏
    </button>
  </header>

  <input id="folder-input" type="file" webkitdirectory multiple hidden>
  <input id="background-input" type="file" accept="image/*" hidden>

  <template id="animation-template">
    <div class="animation-motion">
      <label class="animation-field">
        <span>动作</span>
        <select data-motion-select></select>
      </label>
      <button type="button" data-play-motion>播放</button>
    </div>
    <label class="animation-field">
      <span>表情</span>
      <select data-expression-select></select>
    </label>
    <p class="animation-error error" data-animation-error role="status" hidden></p>
  </template>

  <section id="background-popover" class="tool-popover glass" popover="auto" aria-labelledby="background-heading">
    <h2 id="background-heading">画布背景</h2>
    <div class="background-swatches" aria-label="预设颜色">
      <button type="button" data-background="" aria-pressed="true"><span class="swatch theme-swatch"></span>默认</button>
      <button type="button" data-background="#ffffff" aria-pressed="false"><span class="swatch" style="--swatch: #fff"></span>白色</button>
      <button type="button" data-background="#d9e6f7" aria-pressed="false"><span class="swatch" style="--swatch: #d9e6f7"></span>雾蓝</button>
      <button type="button" data-background="#f6e4eb" aria-pressed="false"><span class="swatch" style="--swatch: #f6e4eb"></span>浅粉</button>
      <button type="button" data-background="#262b39" aria-pressed="false"><span class="swatch" style="--swatch: #262b39"></span>炭黑</button>
      <button type="button" data-background="#00b140" aria-pressed="false"><span class="swatch" style="--swatch: #00b140"></span>绿幕</button>
    </div>
    <button id="upload-background" type="button" class="background-upload">上传图片</button>
    <p id="background-status" class="inline-message muted" role="status" hidden></p>
  </section>

  <aside id="inspector" class="inspector glass" aria-labelledby="inspector-heading" hidden>
    <div id="inspector-bar" class="inspector-bar">
      <h2 id="inspector-heading">参数检查器</h2>
      <button id="close-inspector" type="button" class="quiet close" aria-label="关闭参数检查器">×</button>
    </div>
    <div class="inspector-content">
      <div id="inspector-animation" class="animation-controls"></div>
      <div class="panel-switch" aria-label="检查器面板">
        <button id="show-parameters" type="button" aria-pressed="true" aria-controls="parameters-view">实时参数</button>
        <button id="show-json" type="button" aria-pressed="false" aria-controls="json-view">JSON 快照</button>
        <button id="reset-parameters" type="button">重置参数</button>
      </div>
      <section id="parameters-view" class="parameters-view" aria-label="实时参数">
        <div class="parameter-toolbar">
          <input id="parameter-search" type="search" placeholder="搜索参数 ID" aria-label="搜索参数 ID">
          <span id="parameter-count" class="muted"></span>
        </div>
        <p id="parameter-hint" class="parameter-hint muted"></p>
        <div id="parameter-list" class="parameter-list"></div>
      </section>
      <section id="json-view" class="json-view" aria-label="JSON 快照" hidden>
        <label for="parameter-json">参数 JSON</label>
        <textarea id="parameter-json" placeholder='{"ParamAngleX": 10}' spellcheck="false"></textarea>
        <div class="json-actions">
          <button id="export-json" type="button">导出当前参数</button>
          <button id="import-json" type="button" class="primary">导入 JSON</button>
        </div>
        <p id="json-status" class="inline-message muted" role="status">粘贴参数 JSON 后导入，模型会暂停并应用数值。</p>
      </section>
    </div>
  </aside>

  <aside id="transform-window" class="transform-window glass" aria-labelledby="transform-heading" hidden>
    <div class="inspector-bar">
      <h2 id="transform-heading">移动与旋转</h2>
      <button id="close-transform" type="button" class="quiet close" aria-label="关闭移动与旋转">×</button>
    </div>
    <div class="transform-content">
      <div class="transform-position">
        <div class="direction-pad" role="group" aria-label="移动方向">
          <button type="button" class="move-up" aria-label="向上移动" data-axis="y" data-increment="-10">↑</button>
          <button type="button" class="move-left" aria-label="向左移动" data-axis="x" data-increment="-10">←</button>
          <button type="button" class="move-down" aria-label="向下移动" data-axis="y" data-increment="10">↓</button>
          <button type="button" class="move-right" aria-label="向右移动" data-axis="x" data-increment="10">→</button>
        </div>
        <div class="position-fields">
          <label class="transform-field">X <input type="number" step="any" data-placement-field="x" aria-label="横向位置"><span>px</span></label>
          <label class="transform-field">Y <input type="number" step="any" data-placement-field="y" aria-label="纵向位置"><span>px</span></label>
          <button type="button" class="reset-position" data-reset="position" title="重置到展示区左侧">重置位置</button>
        </div>
      </div>
      <div class="transform-rotation">
        <button type="button" aria-label="逆时针旋转" data-axis="angle" data-increment="-5">↶</button>
        <button type="button" aria-label="顺时针旋转" data-axis="angle" data-increment="5">↷</button>
        <label class="transform-field">角度 <input type="number" step="any" data-placement-field="angle" aria-label="旋转角度"><span>°</span></label>
        <button type="button" data-reset="rotation">重置旋转</button>
      </div>
    </div>
  </aside>

  <section id="load-report" class="load-report glass" aria-label="模型加载状态" hidden>
    <div class="report-header">
      <p id="load-message" role="status"></p>
      <button id="dismiss-report" type="button" class="quiet close" aria-label="关闭导入提示" hidden>×</button>
    </div>
    <ul id="load-errors" hidden></ul>
  </section>
</body>
</html>
